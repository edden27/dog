excluded:
  - .build
  - LocalPackages
  - DerivedDocumentation
  - dist
  # Benchmark one-offs and test fixture files — fixtures are data, not code
  - scripts
  - perf
  # Auto-generated (see file headers) — regenerated by scripts, never hand-edited
  - Sources/dog/Parsing/Languages/EmbeddedQueries.swift
  - Sources/dog/Parsing/Languages/EmbeddedCompiledQueries.swift
  - Sources/dog/Theme/EmbeddedWoofSnippets.swift

# Trailing commas make diffs cleaner — adding a line doesn't modify the previous line
disabled_rules:
  - trailing_comma
  - opening_brace
  - optional_data_string_conversion
  # Project guidelines encourage TODO:/FIXME: markers with context — flagging them is noise
  - todo

# Language and character dispatch uses large flat switches by design —
# a switch with many cases is a lookup table, not tangled logic
cyclomatic_complexity:
  ignores_case_statements: true
